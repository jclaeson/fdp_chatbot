<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FedEx API Assistant</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4a148c 0%, #7b1fa2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .loader {
            text-align: center;
            color: white;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Loading FedEx API Assistant...</p>
    </div>

    <script>
        // Check if user is authenticated
        function isAuthenticated() {
            const authToken = localStorage.getItem('fedex_api_auth');
            const expiryTime = localStorage.getItem('fedex_api_auth_expiry');

            if (!authToken || !expiryTime) {
                return false;
            }

            // Check if expired
            if (Date.now() > parseInt(expiryTime)) {
                localStorage.removeItem('fedex_api_auth');
                localStorage.removeItem('fedex_api_auth_expiry');
                return false;
            }

            return true;
        }

        // Check authentication and redirect
        if (isAuthenticated()) {
            // User is authenticated, go to main portal
            window.location.href = 'home.html';
        } else {
            // User is not authenticated, go to login
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
